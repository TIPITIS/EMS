<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — LSHD</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <div class="topline">
    <div class="container topline-content">
      <span aria-hidden="true">✚</span>
      <span>Los Santos Health Department</span>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">✚</span>
        <span class="brand-text">
          <small>LOS SANTOS</small>
          <strong>Health Department</strong>
        </span>
      </a>

      <a class="button button-outline button-small" href="index.html">
        ← Retour à l’accueil
      </a>
    </div>
  </header>

  <main class="auth-background">
    <section class="auth-card auth-card-wide" aria-labelledby="register-title">
      <div class="auth-symbol" aria-hidden="true">✚</div>

      <p class="eyebrow eyebrow-blue">ESPACE MEMBRE</p>
      <h1 id="register-title">Créer un compte</h1>
      <p class="muted" id="account-capacity" aria-live="polite"></p>

      <form id="register-form" data-audit-ignore novalidate>
        <div class="form-row">
          <div>
            <label for="last-name">Nom</label>
            <input
              id="last-name"
              name="lastName"
              type="text"
              autocomplete="family-name"
              maxlength="50"
              placeholder="Nom"
              required
            >
          </div>

          <div>
            <label for="first-name">Prénom</label>
            <input
              id="first-name"
              name="firstName"
              type="text"
              autocomplete="given-name"
              maxlength="50"
              placeholder="Prénom"
              required
            >
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="birth-date">Date de naissance</label>
            <input
              id="birth-date"
              name="birthDate"
              type="date"
              required
            >
          </div>

          <div>
            <label for="phone">Numéro</label>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              maxlength="20"
              placeholder="Numéro de téléphone"
              required
            >
          </div>
        </div>

        <label for="new-username">Nom d’utilisateur</label>
        <input
          id="new-username"
          name="username"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="24"
          pattern="[A-Za-z0-9._-]+"
          placeholder="Ex. john_coopper"
          required
        >
        <p class="field-help">
          De 3 à 24 caractères : lettres, chiffres, point, tiret ou tiret bas.
        </p>

        <label for="new-password">Mot de passe</label>
        <input
          id="new-password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="6 caractères minimum"
          required
        >

        <button
          class="button button-primary button-wide"
          id="register-submit"
          type="submit"
        >
          Créer mon compte
        </button>

        <p id="register-feedback" class="form-feedback" aria-live="polite"></p>
      </form>

      <p class="auth-foot">
        Tu as déjà un compte ?
        <a href="connexion.html">Se connecter</a>
      </p>
    </section>
  </main>

  <footer class="auth-footer">
    <a href="index.html">LSHD</a> · Projet GTA RP
  </footer>
</body>
</html>
