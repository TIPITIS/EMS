<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Règlement — LSHD</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/personnel.css">
  <script src="../../js/app.js" defer></script>
  <script src="../../js/personnel.js" defer></script>
</head>
<body
  class="workspace-body personnel-body"
  data-protected-page
  data-access="connected"
  data-login-url="../../connexion.html"
  data-personnel-page="regulation"
  data-audit-ignore
>
  <header class="workspace-header">
    <a class="workspace-brand" href="../espace.html#accueil">
      <span class="workspace-brand-icon" aria-hidden="true">✚</span>
      <span><strong>LSHD</strong><small>Los Santos Health Department</small></span>
    </a>
    <div class="workspace-user">
      <div class="user-info">
        <strong data-user-name>Membre</strong>
        <small data-user-role>Personnel médical</small>
      </div>
      <button class="button button-outline button-small" type="button" data-logout>
        Déconnexion
      </button>
    </div>
  </header>

  <nav class="personnel-nav" aria-label="Menu Personnel">
    <a href="../espace.html#accueil">Espace professionnel</a>
    <a href="profil.html">Mon profil</a>
    <a href="contrat_de_travail.html">Contrat de travail</a>
    <a href="prise_de_service.html">Prise de service</a>
    <a class="active" href="reglement.html">Règlement</a>
    <a href="document.html">Documents</a>
  </nav>

  <main class="workspace-main">
    <div class="container workspace-container">
      <div class="workspace-heading">
        <div>
          <p class="eyebrow eyebrow-blue">ESPACE PERSONNEL</p>
          <h1>Règlement du LSHD</h1>
          <p class="muted">Lis le règlement et signe sa version actuelle.</p>
        </div>
        <span class="demo-badge">Démonstration</span>
      </div>

      <section class="personnel-card">
        <p class="regulation-version">Version actuelle : <strong id="regulation-version"></strong></p>
        <div id="regulation-content" class="regulation-text"></div>
      </section>

      <section class="personnel-card">
        <div id="regulation-signed-state" class="signed-state" hidden></div>
        <form id="regulation-sign-form" class="signature-box">
          <h2>Signature du règlement</h2>
          <label for="regulation-sign-name">Nom complet à signer</label>
          <input id="regulation-sign-name" name="signature" autocomplete="name" required>
          <label class="check-row">
            <input id="regulation-accept" type="checkbox" required>
            <span>Je confirme avoir lu et accepté le règlement du LSHD.</span>
          </label>
          <button class="button button-primary" type="submit">Signer le règlement</button>
          <p id="regulation-feedback" class="personnel-feedback" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
