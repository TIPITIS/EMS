<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — LSHD</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <div class="topline">
    <div class="container topline-content">
      <span aria-hidden="true">✚</span>
      <span>Los Santos Health Department</span>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">✚</span>
        <span class="brand-text">
          <small>LOS SANTOS</small>
          <strong>Health Department</strong>
        </span>
      </a>

      <a class="button button-outline button-small" href="index.html">
        ← Retour à l’accueil
      </a>
    </div>
  </header>

  <main class="auth-background">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-symbol" aria-hidden="true">✚</div>

      <p class="eyebrow eyebrow-blue">ESPACE MEMBRE</p>
      <h1 id="login-title">Se connecter</h1>

      <form id="login-form" class="login-form" data-audit-ignore novalidate>
        <label for="username">Nom d’utilisateur</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="Ton nom d’utilisateur"
          required
        >

        <label for="password">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Mot de passe"
          required
        >

        <button class="button button-primary button-wide" type="submit">
          Se connecter
        </button>

        <p id="login-feedback" class="form-feedback" aria-live="polite"></p>
      </form>

      <p class="auth-foot">
        Pas encore de compte ?
        <a href="creation-compte.html">Créer un compte</a>
      </p>
    </section>
  </main>

  <footer class="auth-footer">
    <a href="index.html">LSHD</a> · Projet GTA RP
  </footer>
</body>
</html>
